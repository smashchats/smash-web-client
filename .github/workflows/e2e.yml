name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, webkit-ui, firefox-ui]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build application
        run: npm run build
        env:
          VITE_TEST_MODE: true
          VITE_DISABLE_SW: true
          VITE_TEST_TRANSPORT: relay
          VITE_SME_URL: http://localhost:12345/valid
          VITE_SME_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEg6rwXUOg3N18rZlQRS8sCmKGuB4opGtTXvYi7DkXltVzK0rEVd91HgM7L9YEyTsM9ntJ8Ye+rHey0LiUZwFwAw==
          VITE_NAB_URL: http://localhost:12346

      - name: Start mock servers
        run: npm run dev:mocks &
        
      - name: Wait for mock servers to be ready
        run: |
          echo "Waiting for mock servers to start..."
          timeout 30 bash -c 'while ! curl -s http://localhost:12345/api/health > /dev/null; do sleep 1; done'
          timeout 30 bash -c 'while ! curl -s http://localhost:12346/health > /dev/null; do sleep 1; done'
          echo "Mock servers are ready!"

      - name: Serve application
        run: npm run preview &
        env:
          VITE_TEST_MODE: true
          VITE_DISABLE_SW: true
          VITE_TEST_TRANSPORT: relay
          VITE_SME_URL: http://localhost:12345/valid
          VITE_SME_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEg6rwXUOg3N18rZlQRS8sCmKGuB4opGtTXvYi7DkXltVzK0rEVd91HgM7L9YEyTsM9ntJ8Ye+rHey0LiUZwFwAw==
          VITE_NAB_URL: http://localhost:12346

      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to start..."
          timeout 60 bash -c 'while ! curl -s http://localhost:4173 > /dev/null; do sleep 1; done'
          echo "Application is ready!"

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: http://localhost:4173
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  e2e-report:
    name: Publish E2E Report
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Merge test reports
        run: |
          npx playwright merge-reports --reporter html ./artifacts/playwright-report-*/
        continue-on-error: true

      - name: Publish HTML report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: e2e-reports/${{ github.run_number }}

      - name: Comment PR with report link
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e-reports/${{ github.run_number }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎭 E2E Test Report
              
              📊 **Test Results**: [View Report](${reportUrl})
              
              The E2E test report has been published and will be available shortly.
              `
            });